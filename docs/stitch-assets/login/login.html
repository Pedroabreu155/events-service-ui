<!DOCTYPE html>

<html class="dark" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "background": "#000000",
              "on-background": "#e2e2e2",
              "secondary-container": "#3f4944",
              "on-surface-variant": "#bccac0",
              "on-tertiary-fixed": "#0f1f18",
              "primary-fixed-dim": "#59dda9",
              "primary": "#59dda9",
              "primary-fixed": "#78fac3",
              "on-primary-fixed-variant": "#005138",
              "secondary": "#bfc9c2",
              "surface-container-highest": "#353535",
              "on-error": "#690005",
              "on-surface": "#e2e2e2",
              "inverse-surface": "#e2e2e2",
              "secondary-fixed-dim": "#bfc9c2",
              "outline-variant": "#3d4a42",
              "on-primary-container": "#003422",
              "tertiary-fixed-dim": "#b8cbc0",
              "on-tertiary": "#24342d",
              "tertiary-container": "#86988e",
              "on-error-container": "#ffdad6",
              "tertiary": "#b8cbc0",
              "surface-dim": "#131313",
              "primary-container": "#00a878",
              "tertiary-fixed": "#d4e7dc",
              "error-container": "#93000a",
              "on-primary-fixed": "#002114",
              "surface-container-lowest": "#0e0e0e",
              "on-secondary-fixed": "#141d19",
              "on-secondary": "#29322e",
              "on-secondary-container": "#adb8b1",
              "on-tertiary-fixed-variant": "#3a4a43",
              "outline": "#86948b",
              "inverse-on-surface": "#303030",
              "surface-variant": "#353535",
              "surface-container": "#1f1f1f",
              "surface": "#131313",
              "surface-container-low": "#1b1b1b",
              "on-primary": "#003826",
              "surface-container-high": "#2a2a2a",
              "surface-bright": "#393939",
              "on-secondary-fixed-variant": "#3f4944",
              "surface-tint": "#59dda9",
              "on-tertiary-container": "#203029",
              "error": "#ffb4ab",
              "secondary-fixed": "#dbe5de",
              "inverse-primary": "#006c4c"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-glow {
            box-shadow: inset 0 1px 1px 0 rgba(120, 250, 195, 0.1);
        }
        .jewel-shadow {
            box-shadow: 0 0 32px rgba(0, 168, 120, 0.08);
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface flex flex-col min-h-screen items-center justify-center selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-[420px] px-6 py-12 relative z-10">
<!-- Evolution Manager Style Login Card -->
<div class="bg-surface-container/60 backdrop-blur-2xl rounded-xl border border-outline-variant/15 glass-glow jewel-shadow p-8 flex flex-col items-center">
<!-- Logo Placeholder -->
<div class="mb-8 flex flex-col items-center">
<div class="w-12 h-12 bg-primary-container flex items-center justify-center rounded-lg mb-4">
<span class="material-symbols-outlined text-on-primary-container text-2xl" data-icon="terminal">terminal</span>
</div>
<h2 class="text-[#00A878] font-headline font-black text-lg tracking-[0.05em] uppercase">Onyx Verdant</h2>
</div>
<!-- Title -->
<h1 class="font-headline text-2xl font-bold tracking-tight text-center mb-8 text-on-surface">
                Acesse seu Log de Eventos
            </h1>
<!-- Form -->
<form class="w-full space-y-6">
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.1em] font-bold text-on-secondary-container" for="apikey">
                        Chave de API Global
                    </label>
<div class="relative group">
<input class="w-full bg-surface-container-lowest border border-outline-variant/30 text-on-surface px-4 py-3 rounded-md focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200 outline-none text-sm font-mono placeholder:text-surface-container-highest" id="apikey" placeholder="sk-••••••••••••••••••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary-container hover:bg-primary-fixed-dim text-on-primary-fixed font-headline font-bold py-3 px-6 rounded-md transition-all duration-200 active:scale-[0.98] jewel-shadow flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Reset Option -->
<div class="mt-6">
<a class="text-xs text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">
                    Esqueceu sua chave de acesso?
                </a>
</div>
</div>
</main>
<!-- Subtle Footer -->
<footer class="fixed bottom-8 w-full px-8 flex flex-col items-center gap-4">
<div class="h-[1px] w-12 bg-outline-variant/20 mb-2"></div>
<div class="flex items-center gap-6">
<a class="group flex items-center gap-2 text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-base group-hover:text-primary" data-icon="description">description</span>
                Docs
            </a>
<a class="group flex items-center gap-2 text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-base group-hover:text-primary" data-icon="code">code</span>
                GitHub
            </a>
<a class="group flex items-center gap-2 text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors" href="#">
<span class="material-symbols-outlined text-base group-hover:text-primary" data-icon="support_agent">support_agent</span>
                Suporte
            </a>
</div>
<p class="text-[10px] text-surface-container-highest tracking-widest uppercase font-bold mt-2">
            Obsidian Architect © 2024
        </p>
</footer>
<!-- Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden -z-0">
<!-- Top Left Radial Glow -->
<div class="absolute -top-1/4 -left-1/4 w-[60%] h-[60%] rounded-full opacity-20 blur-[120px]" style="background: radial-gradient(circle, #00A878 0%, transparent 70%);"></div>
<!-- Bottom Right Radial Glow -->
<div class="absolute -bottom-1/4 -right-1/4 w-[60%] h-[60%] rounded-full opacity-10 blur-[120px]" style="background: radial-gradient(circle, #00A878 0%, transparent 70%);"></div>
</div>
</body></html>
